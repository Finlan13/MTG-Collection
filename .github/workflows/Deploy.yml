name: Deploy MTG Collection Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "output/collection.json"
      - ".github/workflows/deploy-website.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package.json

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Prepare collection data
        run: |
          mkdir -p website/public
          cp output/collection.json website/public/collection.json
          echo "Collection file:"
          ls -lh website/public/collection.json

      - name: Build website
        working-directory: website
        run: npx vite build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
