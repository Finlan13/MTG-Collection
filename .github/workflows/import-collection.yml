name: Import MTG Collection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-collection:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Import collection
        run: python scripts/import_collection.py

      - name: Show collection summary
        run: |
          echo "Collection JSON:"
          ls -lh output/collection.json
          echo "Card master:"
          ls -lh output/cards.json

      - name: Commit updated collection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/collection.json output/cards.json

          git diff --cached --quiet || git commit -m "Import updated MTG collection"

          git push
